<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Dashboard - SyncBite</title>
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 200px;
            margin-top: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .bar {
            flex: 1;
            background: var(--primary-color);
            border-radius: 4px 4px 0 0;
            opacity: 0.8;
            transition: var(--transition);
            position: relative;
        }

        .bar:hover {
            opacity: 1;
        }

        .bar span {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2 style="margin-bottom: 40px; color: var(--white);">SyncBite</h2>
            <ul class="sidebar-links">
                <li><a href="add-surplus.html">Add Surplus Food</a></li>
                <li><a href="#" class="active">Impact Dashboard</a></li>
                <li style="margin-top: 40px;"><a href="index.html">Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <h2 style="margin-bottom: 30px; color: var(--primary-color);">Impact Dashboard</h2>

                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="card stat-card">
                        <h3>Total Meals Saved</h3>
                        <div class="value">1,245</div>
                    </div>
                    <div class="card stat-card">
                        <h3>People Fed</h3>
                        <div class="value">3,500+</div>
                    </div>
                    <div class="card stat-card">
                        <h3>NGOs Connected</h3>
                        <div class="value">12</div>
                    </div>
                    <div class="card stat-card">
                        <h3>Food Waste Reduced</h3>
                        <div class="value">450 kg</div>
                    </div>
                </div>

                <!-- Weekly Chart -->
                <div class="card">
                    <h3 style="color: #444;">Weekly Meals Collected</h3>
                    <div class="bar-chart">
                        <div class="bar" style="height: 40%;"><span>Mon</span></div>
                        <div class="bar" style="height: 65%;"><span>Tue</span></div>
                        <div class="bar" style="height: 50%;"><span>Wed</span></div>
                        <div class="bar" style="height: 80%;"><span>Thu</span></div>
                        <div class="bar" style="height: 60%;"><span>Fri</span></div>
                        <div class="bar" style="height: 90%;"><span>Sat</span></div>
                        <div class="bar" style="height: 45%;"><span>Sun</span></div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>

</html>
